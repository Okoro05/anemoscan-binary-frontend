name: Apply AnemoScan branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  brand:
    if: ${{ github.event.head_commit.message != 'chore: apply AnemoScan branding' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace patient header icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/src/App.tsx')
          s = p.read_text()
          s = s.replace('  Home,\n', '')
          old = '<div className="icon-cell"><Home size={20} /></div>'
          new = '<div className="icon-cell"><img src="/anemoscan-mark.svg" alt="AnemoScan" style={{ width: 24, height: 24 }} /></div>'
          if old not in s:
              raise SystemExit('patient header icon pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit branding change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-anemoscan-branding.yml
          git add web/src/App.tsx .github/workflows/apply-anemoscan-branding.yml
          git commit -m "chore: apply AnemoScan branding"
          git push
