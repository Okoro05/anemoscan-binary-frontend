name: Apply patient logo and quality threshold fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: !contains(github.event.head_commit.message, 'fix: show patient logo and set quality threshold to 65')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update patient app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/App.tsx')
          text = path.read_text()

          text = text.replace('  Home,\n', '')
          text = text.replace('const qualityThreshold = 70', 'const qualityThreshold = 65')
          old = '<div className="icon-cell"><Home size={20} /></div>'
          new = '<div className="icon-cell"><img src="/anemoscan-mark.svg" alt="AnemoScan" style={{ width: 28, height: 28 }} /></div>'
          if old not in text:
              raise SystemExit('Expected patient header logo placeholder was not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx
          git commit -m "fix: show patient logo and set quality threshold to 65"
          git rm .github/workflows/fix-patient-logo-threshold.yml
          git commit -m "chore: remove temporary patient fix workflow"
          git push