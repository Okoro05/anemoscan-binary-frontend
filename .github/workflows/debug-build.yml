name: Debug frontend build

on:
  push:
    branches:
      - debug-build-2bb

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix MediaTrackConstraints typing
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/App.tsx')
          text = path.read_text()
          old = "video: { facingMode, aspectRatio: { ideal: 16 / 9 }, width: { ideal: 1280 }, height: { ideal: 720 }, resizeMode: 'none' }, audio: false"
          new = "video: ({ facingMode, aspectRatio: { ideal: 16 / 9 }, width: { ideal: 1280 }, height: { ideal: 720 }, resizeMode: 'none' } as MediaTrackConstraints & { resizeMode: string }), audio: false"
          if old not in text:
              raise SystemExit('Expected camera constraint line was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx
          git commit -m "fix: restore camera constraint typing"
          git push
      - run: npm install
      - run: npm run build
